name: Release Train

on:
  workflow_dispatch:
    inputs:
      action:
        description: Release train transition
        required: true
        type: choice
        options:
          - start-minor-alpha
          - start-major-alpha
          - start-minor-rc
          - start-major-rc
          - start-minor-stable
          - start-major-stable
          - alpha-bump
          - promote-rc
          - rc-bump
          - stable
          - patch
          - patch-alpha-start
          - patch-rc-start
      dry_run:
        description: Validate and show the computed release without pushing.
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.repository }}-release-train
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  release-train:
    name: Release train
    uses: revisium/revisium-actions/.github/workflows/release-train.yml@70181e04f5a944cde53f3f455813b6e6d4e8d9fd # v0.4.0
    with:
      action: ${{ inputs.action }}
      dry_run: ${{ inputs.dry_run }}
      base_branch: master
      node_version: 24.11.1
      package_manager: pnpm
      install_command: corepack enable && pnpm install --frozen-lockfile
      validate_command: |
        cp .env.example .env
        pnpm run test:cov
        pnpm run lint:ci
        pnpm run tsc
        pnpm run test:e2e:up
        trap 'pnpm run test:e2e:down' EXIT
        DATABASE_URL='postgresql://revisium:password@localhost:5437/revisium-endpoint-test?schema=public' REVISIUM_NO_AUTH='true' PORT=8082 CORE_API_URL='http://127.0.0.1:8082' pnpm run test:e2e
        pnpm run build
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
