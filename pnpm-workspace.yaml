allowBuilds:
  '@swc/core': true
  bcrypt: true
  sharp: true
  '@prisma/engines': true
  prisma: true
  # @apollo/protobufjs is intentionally excluded: its postinstall only creates a CLI
  # directory and prints a cosmetic warning — no functional impact; leave blocked.
  '@apollo/protobufjs': false
  # @nestjs/core is intentionally excluded: telemetry postinstall — leave blocked.
  '@nestjs/core': false
  # @scarf/scarf is intentionally excluded: analytics postinstall — leave blocked.
  '@scarf/scarf': false

# Overrides moved here from package.json: pnpm 11 ignores the package.json `pnpm` settings field
# (e.g. pnpm.overrides); pnpm-workspace.yaml is the single source of truth.
overrides:
  hono: ^4.12.18
  '@hono/node-server': ^1.19.13
  valibot: ^1.2.0
  lodash: ^4.18.1
  '@angular-devkit/core>ajv': ^8.18.0
  'schema-utils>ajv': ^8.18.0
  fast-uri: ^3.1.2
  fast-xml-builder: ^1.2.0
  file-type: ^21.3.2
  effect: ^3.21.0
  ip-address: ^10.2.0
  '@apollo/server>uuid': ^14.0.0
  '@apollo/federation-internals>uuid': ^14.0.0
